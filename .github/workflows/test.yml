name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Electron ikilisi indirilmez ve yerel modüller Electron'a göre yeniden
      # derlenmez (postinstall); testler düz Node ile çalışır.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # İndirmeleri qBittorrent yapar; testler gerçek qbittorrent-nox ile çalışır.
      - run: sudo apt-get update && sudo apt-get install -y qbittorrent-nox
      - run: npm test
